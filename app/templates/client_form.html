{% extends "base.html" %}{% block title %}Nouveau professionnel — NASORA CRM{% endblock %}{% block content %}
<div class="page-hero"><div><h1>Nouveau professionnel</h1><p>Créez une fiche client exploitable par toute la force de vente.</p></div><div class="hero-actions"><a class="btn btn-outline" href="{{ url_for('clients.list_clients') }}">← Retour</a></div></div>
<form method="post" class="form-container"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-grid"><div><label>Nom du professionnel *</label><input class="form-input" name="name" required value="{{ client.name if client else '' }}"></div><div><label>Spécialité</label><input class="form-input" name="specialty" value="{{ client.specialty if client else '' }}"></div><div><label>Structure *</label><select class="form-input" name="structure" required>{% for s in structure_choices %}<option value="{{ s }}" {% if client and client.structure==s %}selected{% endif %}>{{ s }}</option>{% endfor %}</select></div><div><label>Établissement / pharmacie</label><input class="form-input" name="establishment" value="{{ client.establishment if client else '' }}"></div><div><label>Téléphone</label><input class="form-input" name="phone" value="{{ client.phone if client else '' }}"></div><div><label>Email</label><input class="form-input" type="email" name="email" value="{{ client.email if client else '' }}"></div><div><label>Zone</label><input class="form-input" name="zone" value="{{ client.zone if client else '' }}"></div><div><label>Potentiel commercial</label><select class="form-input" name="potential">{% for p in range(1,6) %}<option value="{{ p }}" {% if client and client.potential==p %}selected{% elif not client and p==3 %}selected{% endif %}>{{ p }} ★</option>{% endfor %}</select></div><div class="full"><label>Adresse</label><input class="form-input" name="address" value="{{ client.address if client else '' }}"></div><div class="full"><label>Notes</label><textarea class="form-input" name="notes" rows="5">{{ client.notes if client else '' }}</textarea></div></div><div class="form-actions"><button class="btn" type="submit">Enregistrer le professionnel</button></div></form>{% endblock %}
