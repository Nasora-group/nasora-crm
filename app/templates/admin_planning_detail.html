{% extends "base.html" %}

{% block content %}
<h1>Planning de {{ commercial.username }}</h1>
<a href="{{ url_for('planning.admin_plannings') }}" class="btn btn-outline">&laquo; Retour à la liste</a>

{% if plannings %}
    {% for planning in plannings %}
        {% include "_planning_week_card.html" %}
    {% endfor %}
{% else %}
    <p>Aucun planning saisi pour ce commercial.</p>
{% endif %}
{% endblock %}
