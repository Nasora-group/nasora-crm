<section class="summary-card commercial-revenue-existing" style="margin-top:18px;">
  <div class="section-heading">
    <div>
      <span class="crm-overline">VISUALISATION DU CA</span>
      <h2>CA mensuel · {{ division_label }}</h2>
      <p class="crm-subtitle">Visualisation basée sur l'historique complet de la division, comme la page CA mensuel.</p>
    </div>
  </div>

  <div id="commercial-revenue-history">
    <div class="crm-loading-state">Chargement de l'historique CA…</div>
  </div>
</section>

<script>
(function () {
  const target = document.getElementById('commercial-revenue-history');
  if (!target) return;

  const division = {{ division|tojson }};
  const sourceUrl = division === 'nasderm'
    ? '{{ url_for("revenue.monthly_revenue_nasderm") }}'
    : '{{ url_for("revenue.monthly_revenue_nasmedic") }}';

  fetch(sourceUrl, { credentials: 'same-origin', headers: { 'X-Requested-With': 'XMLHttpRequest' } })
    .then(function (response) {
      if (!response.ok) throw new Error('HTTP ' + response.status);
      return response.text();
    })
    .then(function (html) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(html, 'text/html');

      // On reprend directement les blocs de la page CA mensuel existante.
      const kpis = doc.querySelector('.division-kpi-grid');
      const table = doc.querySelector('.crm-table-card');
      const tableFallback = doc.querySelector('table');

      target.innerHTML = '';
      if (kpis) target.appendChild(kpis.cloneNode(true));
      if (table) {
        target.appendChild(table.cloneNode(true));
      } else if (tableFallback) {
        const wrapper = document.createElement('section');
        wrapper.className = 'crm-surface crm-table-card';
        wrapper.appendChild(tableFallback.cloneNode(true));
        target.appendChild(wrapper);
      }

      if (!target.children.length) {
        target.innerHTML = '<div class="crm-empty-state">Aucun historique CA disponible.</div>';
      }
    })
    .catch(function () {
      target.innerHTML = '<div class="crm-empty-state">Impossible de charger l’historique CA pour le moment.</div>';
    });
})();
</script>

<style>
.commercial-revenue-existing #commercial-revenue-history{margin-top:16px}
.commercial-revenue-existing #commercial-revenue-history .division-kpi-grid{margin-bottom:14px}
.commercial-revenue-existing #commercial-revenue-history .crm-table-card{margin-top:14px;overflow:auto}
.commercial-revenue-existing #commercial-revenue-history table{min-width:850px}
.commercial-revenue-existing #commercial-revenue-history th{white-space:nowrap}
@media(max-width:760px){
  .commercial-revenue-existing #commercial-revenue-history{overflow-x:auto}
  .commercial-revenue-existing #commercial-revenue-history table{min-width:720px}
}
</style>
