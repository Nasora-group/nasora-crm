{% extends "base.html" %}

{% block title %}403 — Accès refusé | NASORA CRM{% endblock %}
{% block content %}
<div class="error-page" role="main">
  <section class="error-card" aria-labelledby="error-title">
    <div class="error-icon" aria-hidden="true">🔒</div>
    <div class="error-code">403</div>
    <h1 id="error-title">Accès refusé</h1>
    <p>Votre compte ne dispose pas des autorisations nécessaires pour accéder à cette ressource.</p>
    <div class="error-actions">
      <a href="{{ url_for('auth.home') }}" class="btn">⌂ Retour à l’accueil</a>
      <a href="javascript:history.back()" class="btn btn-outline">← Page précédente</a>
    </div>
  </section>
</div>
{% endblock %}
