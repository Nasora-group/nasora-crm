{% extends "base.html" %}{% block content %}<div class="container-fluid"><h1>Pipeline prescriptions</h1><form method="post" class="row g-2 mb-4"><select name="client_id" class="form-select col" required><option value="">Professionnel</option>{% for c in clients %}<option value="{{c.id}}">{{c.name}} - {{c.structure}}</option>{% endfor %}</select><input name="product_name" class="form-control col" placeholder="Produit"><select name="stage" class="form-select col">{% for s in stages %}<option value="{{s}}">{{s}}</option>{% endfor %}</select><input name="interest_level" class="form-control col" placeholder="Intérêt"><input name="potential_prescription" type="number" min="0" class="form-control col" placeholder="Potentiel"><input name="next_followup" type="date" class="form-control col"><button class="btn btn-success col">Ajouter</button></form><table class="table table-striped"><tr><th>Professionnel</th><th>Produit</th><th>Étape</th><th>Potentiel</th><th>Obtenu</th><th>Relance</th></tr>{% for r in rows %}<tr><td>{{r.client.name}}</td><td>{{r.product_name or ''}}</td><td>{{r.stage}}</td><td>{{r.potential_prescription}}</td><td>{{r.obtained_prescription}}</td><td>{{r.next_followup or ''}}</td></tr>{% endfor %}</table></div>{% endblock %}
