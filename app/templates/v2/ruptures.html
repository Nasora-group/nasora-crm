{% extends "base.html" %}{% block content %}<div class="container-fluid"><h1>Ruptures</h1><form method="post" class="row g-2 mb-3"><select name="division" class="form-select col"><option>nasmedic</option><option>nasderm</option></select><input name="laboratory" class="form-control col" placeholder="Laboratoire"><input name="product_name" required class="form-control col" placeholder="Produit"><input name="wholesaler" class="form-control col" placeholder="Grossiste"><input name="quantity" type="number" min="0" class="form-control col" placeholder="Quantité"><button class="btn btn-danger col">Déclarer</button></form><table class="table"><tr><th>Date</th><th>Division</th><th>Produit</th><th>Grossiste</th><th>Qté</th><th>Statut</th><th>Workflow</th></tr>{% for r in rows %}<tr><td>{{r.reported_at}}</td><td>{{r.division}}</td><td>{{r.product_name}}</td><td>{{r.wholesaler or ''}}</td><td>{{r.quantity}}</td><td>{{r.status}}</td><td><form method="post" action="{{url_for('v2_complete.rupture_status',rupture_id=r.id)}}"><select name="status" class="form-select form-select-sm"><option>rupture</option><option>procurement</option><option>stock_available</option><option>resolved</option></select><button class="btn btn-sm btn-outline-success">Mettre à jour</button></form></td></tr>{% endfor %}</table></div>{% endblock %}
