{% extends "base.html" %}{% block content %}<div class="container-fluid"><h1>Planning : prévu → réalisé</h1><table class="table table-striped"><tr><th>Date</th><th>Utilisateur</th><th>Structure</th><th>Statut</th><th>Motif</th><th>Action</th></tr>{% for r in rows %}<tr><td>{{r.execution_date}}</td><td>{{r.user.username}}</td><td>{{r.structure_name}}</td><td>{{r.status}}</td><td>{{r.reason or ''}}</td><td><form method="post" class="d-flex gap-1"><input type="hidden" name="execution_id" value="{{r.id}}"><select name="status" class="form-select form-select-sm"><option>planned</option><option>realized</option><option>not_realized</option></select><select name="reason" class="form-select form-select-sm"><option value="">Motif</option>{% for x in reasons %}<option>{{x}}</option>{% endfor %}</select><button class="btn btn-sm btn-success">Enregistrer</button></form></td></tr>{% endfor %}</table></div>{% endblock %}
