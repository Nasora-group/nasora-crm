{% extends "base.html" %}{% block content %}<div class="container-fluid"><h1>Demandes de réassort</h1><form method="post" class="row g-2 mb-3"><select name="division" class="form-select col"><option>nasmedic</option><option>nasderm</option></select><input name="laboratory" class="form-control col" placeholder="Laboratoire"><input name="product_name" required class="form-control col" placeholder="Produit"><input name="wholesaler" class="form-control col" placeholder="Grossiste"><input name="quantity" type="number" min="1" class="form-control col" placeholder="Quantité"><button class="btn btn-success col">Demander</button></form><table class="table"><tr><th>Date</th><th>Division</th><th>Produit</th><th>Grossiste</th><th>Qté</th><th>Statut</th></tr>{% for r in rows %}<tr><td>{{r.requested_at}}</td><td>{{r.division}}</td><td>{{r.product_name}}</td><td>{{r.wholesaler or ''}}</td><td>{{r.quantity}}</td><td>{{r.status}}</td></tr>{% endfor %}</table></div>{% endblock %}
