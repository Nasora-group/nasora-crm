{% extends "base.html" %}{% block content %}<div class="container-fluid"><h1>Centre de notifications intelligent</h1>{% for type,dt,message,level in alerts %}<div class="alert alert-{{'danger' if level=='critical' else 'warning'}}"><strong>{{type}}</strong> · {{dt}} · {{message}}</div>{% else %}<div class="alert alert-success">Aucune alerte active.</div>{% endfor %}</div>{% endblock %}
