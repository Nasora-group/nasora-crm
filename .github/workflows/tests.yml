name: NASORA CRM tests

on:
  push:
    branches: [main, v2/develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate browser JavaScript syntax
        run: |
          node --check app/static/js/nasora-offline-drafts.js
          node --check app/static/js/nasora-offline-sync.js
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests
        env:
          FLASK_ENV: testing
          SECRET_KEY: ci-test-secret
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q
