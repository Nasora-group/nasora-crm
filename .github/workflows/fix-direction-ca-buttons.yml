name: Fix Direction CA buttons

on:
  push:
    paths:
      - '.github/workflows/fix-direction-ca-buttons.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reposition CA buttons
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('app/templates/admin_dashboard.html')
          text = path.read_text(encoding='utf-8')

          pattern = re.compile(
              r'<div class="page-hero crm-page-hero"><div>'
              r'<span class="hero-eyebrow">NASORA CRM · DIRECTION</span>'
              r'<h1>Pilotage commercial</h1>'
              r'<p class="crm-subtitle">Une vue claire de la performance, de l\'activité terrain et de l\'équipe\.</p>'
              r'</div><div class="hero-actions">'
              r'<a href="\{\{ url_for\(\'revenue\.nasmedic_dashboard\'\) \}\}" class="btn btn-outline">NASMEDIC</a>'
              r'<a href="\{\{ url_for\(\'revenue\.nasderm_dashboard\'\) \}\}" class="btn btn-outline">NASDERM</a>'
              r'</div></div>'
          )

          replacement = '''<div class="page-hero crm-page-hero"><div><span class="hero-eyebrow">NASORA CRM · DIRECTION</span><h1>Pilotage commercial</h1><p class="crm-subtitle">Une vue claire de la performance, de l'activité terrain et de l'équipe.</p><div class="hero-actions" style="margin-top:18px;"><a href="{{ url_for('revenue.nasmedic_dashboard') }}" class="btn btn-outline">CA NASMEDIC</a><a href="{{ url_for('revenue.nasderm_dashboard') }}" class="btn btn-outline">CA NASDERM</a></div></div></div>'''

          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('Dashboard hero pattern not found; no change made.')
          path.write_text(updated, encoding='utf-8')

      - name: Commit dashboard correction and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/templates/admin_dashboard.html
          git commit -m 'fix: show CA NASMEDIC and CA NASDERM under dashboard heading' || true
          git rm .github/workflows/fix-direction-ca-buttons.yml
          git commit -m 'chore: remove one-shot dashboard fix workflow' || true
          git push