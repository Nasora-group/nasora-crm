name: NASORA dependency audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 8 * * 1"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audit tool
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pip-audit>=2.9,<3"
      - name: Audit production dependencies
        run: pip-audit -r requirements.txt
